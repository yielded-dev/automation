name: Release
run-name: Release @yielded/${{ inputs.package }}@${{ inputs.expected_version }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        options:
          - sandbox
          - automation
      expected_version:
        description: Exact version already committed in the selected package.json
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ inputs.package }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_PACKAGE: ${{ inputs.package }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24.21.0"
          run-install: false
      - name: Validate package and version
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const selected = process.env.RELEASE_PACKAGE;
          assert.ok(["sandbox", "automation"].includes(selected), "Select sandbox or automation");
          const manifest = JSON.parse(readFileSync(`packages/${selected}/package.json`, "utf8"));
          assert.equal(manifest.name, `@yielded/${selected}`, "Unexpected package name");
          assert.notEqual(manifest.private, true, "Cannot publish a private package");
          assert.equal(manifest.version, process.env.EXPECTED_VERSION, "Expected version must match package.json");
          console.log(`Validated ${manifest.name}@${manifest.version}`);
          NODE
      # Keep these gates aligned with check.yml; check builds generated dist.
      - run: vp install --frozen-lockfile
      - run: vp run check
      - name: Verify generated migrations
        run: |
          vp -C examples/postgres run db:generate
          test -z "$(git status --porcelain -- examples/postgres/drizzle)"
      - run: vp run -F @yielded/automation test:e2e
      - run: vp run check:packages
      - name: Pack checked build
        run: |
          cd "packages/$RELEASE_PACKAGE"
          bun pm pack --ignore-scripts --filename "$RUNNER_TEMP/release.tgz"
      - name: Publish with npm trusted publishing
        run: vp env exec --npm 12.2.0 npm publish "$RUNNER_TEMP/release.tgz" --access public --provenance --ignore-scripts --registry https://registry.npmjs.org
