name: PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       contains(github.event.comment.body, '@effect-agent'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - name: Check out trusted review guidance
        if: env.HAS_OPENAI_KEY == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Review the pull request
        if: env.HAS_OPENAI_KEY == 'true'
        uses: yielded-dev/agent/action@action-v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
          checks-token: ${{ github.token }}
          pull-request: ${{ github.event.pull_request.number || github.event.issue.number }}
          review-author: github-actions[bot]
          check-name: Agent review
          mode: ${{ github.event_name == 'pull_request' && 'auto' || 'incremental' }}
          automatic-review-limit: 5
          command: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          comment-id: ${{ github.event.comment.id || 0 }}
          expected-head: ${{ github.event.pull_request.head.sha || '' }}
          model: gpt-6.1-sol
          web-search: "true"
          effort: high
          priority: fast
          base-cost-usd: 20
          max-cost-usd: 50
          # The initial scaffold PR precedes AGENTS.md on the trusted branch.
          guidance-file: ${{ hashFiles('AGENTS.md') != '' && 'AGENTS.md' || '' }}
          ignore: "**/*.map,**/*.lock,packages/automation/dist/**,packages/sandbox/dist/**"
